<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | LUXE SOFA</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: var(--bg-cream);">

    <nav id="navbar" class="scrolled">
        <div class="logo">LUXE SOFA</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="nav-icons">
            <a href="cart.html" class="cart-icon">
                <i class="fas fa-shopping-bag"></i>
                <span id="cart-count">0</span>
            </a>
        </div>
    </nav>

    <div class="section-padding">
        <div class="checkout-container" style="display: flex; gap: 40px; flex-wrap: wrap; max-width: 1200px; margin: 0 auto;">
            
            <!-- Shipping Form -->
            <div style="flex: 2; min-width: 300px;">
                <div class="glass-card" style="padding: 40px;">
                    <h2 style="margin-bottom: 30px;">Shipping Details</h2>
                    <form id="payment-form">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div class="form-group">
                                <label>First Name</label>
                                <input type="text" placeholder="John" required>
                            </div>
                            <div class="form-group">
                                <label>Last Name</label>
                                <input type="text" placeholder="Doe" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Address</label>
                            <input type="text" placeholder="123 Luxury Ave" required>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;">
                            <div class="form-group">
                                <label>City</label>
                                <input type="text" placeholder="New York" required>
                            </div>
                            <div class="form-group">
                                <label>State</label>
                                <input type="text" placeholder="NY" required>
                            </div>
                            <div class="form-group">
                                <label>ZIP Code</label>
                                <input type="text" placeholder="10001" required>
                            </div>
                        </div>

                        <h2 style="margin: 40px 0 30px;">Payment Method</h2>
                        <div class="payment-options" style="display: flex; gap: 20px; margin-bottom: 20px;">
                            <label style="border: 1px solid #ddd; padding: 15px; border-radius: 5px; flex: 1; text-align: center; cursor: pointer;">
                                <input type="radio" name="pay" checked> Card
                            </label>
                            <label style="border: 1px solid #ddd; padding: 15px; border-radius: 5px; flex: 1; text-align: center; cursor: pointer;">
                                <input type="radio" name="pay"> PayPal
                            </label>
                        </div>
                        <div class="form-group">
                            <label>Card Number</label>
                            <input type="text" placeholder="XXXX XXXX XXXX XXXX" required>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div class="form-group">
                                <label>Expiry Date</label>
                                <input type="text" placeholder="MM/YY" required>
                            </div>
                            <div class="form-group">
                                <label>CVV</label>
                                <input type="password" placeholder="***" required>
                            </div>
                        </div>
                        <button type="button" class="btn btn-primary" style="width: 100%; margin-top: 30px;" onclick="processPayment()">Complete Order</button>
                    </form>
                </div>
            </div>

            <!-- Order Summary -->
            <div style="flex: 1; min-width: 300px;">
                <div class="glass-card" style="padding: 30px;">
                    <h3 style="margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px;">Your Items</h3>
                    <div id="checkout-items" style="max-height: 400px; overflow-y: auto;">
                        <!-- JS Loaded -->
                    </div>
                    <div style="border-top: 1px solid #ddd; margin-top: 20px; padding-top: 20px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <span>Subtotal</span>
                            <span id="checkout-subtotal">$0</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <span>Shipping</span>
                            <span style="color: green; font-weight: 600;">FREE</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-top: 20px; font-weight: 700; font-size: 20px;">
                            <span>Total</span>
                            <span id="checkout-total">$0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
