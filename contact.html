<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | LUXE SOFA</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav id="navbar" class="scrolled">
        <div class="logo">LUXE SOFA</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="section-padding">
        <h2 style="text-align: center; margin-bottom: 40px; font-size: 36px;">Get In Touch</h2>
        <div style="display: flex; gap: 50px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 300px;">
                <h3 style="margin-bottom: 20px;">Contact Information</h3>
                <p style="margin-bottom: 10px;"><strong>Showroom:</strong> 123 Luxury Lane, Design District, NY</p>
                <p style="margin-bottom: 10px;"><strong>Phone:</strong> +1 800-LUXE-SOFA</p>
                <p style="margin-bottom: 10px;"><strong>Email:</strong> tirthaatripathy@luxesofa.com</p>
                
                <h3 style="margin: 40px 0 20px;">Store Hours</h3>
                <p>Mon - Fri: 10am - 8pm</p>
                <p>Sat - Sun: 11am - 6pm</p>
            </div>
            <div class="glass-card" style="flex: 1.5; min-width: 300px; padding: 40px;">
                <form id="contact-form">
                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" placeholder="Enter your name" required>
                    </div>
                    <div class="form-group">
                        <label>Your Email</label>
                        <input type="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea style="width: 100%; height: 150px; padding: 12px; border: 1px solid #ddd; border-radius: 5px;" placeholder="How can we help you?"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
